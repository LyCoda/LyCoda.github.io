    <circle cx="58" cy="104" r="7" fill="#245dc1"/><text x="84" y="111" font-size="20" font-weight="600">Intended purpose</text><text x="290" y="111" font-size="18" fill="#586774">Clinician-supervised imaging</text><circle cx="58" cy="156" r="7" fill="#245dc1"/><text x="84" y="163" font-size="20" font-weight="600">Qualification</text><text x="290" y="163" font-size="18" fill="#586774">Article 2(1) medical device</text><circle cx="58" cy="208" r="7" fill="#245dc1"/><text x="84" y="215" font-size="20" font-weight="600">Classification</text><text x="290" y="215" font-size="18" fill="#586774">Rule 10 → Class IIa</text><circle cx="58" cy="260" r="7" fill="#245dc1"/><text x="84" y="267" font-size="20" font-weight="600">Quality system</text><text x="290" y="267" font-size="18" fill="#586774">EN ISO 13485</text><circle cx="58" cy="312" r="7" fill="#245dc1"/><text x="84" y="319" font-size="20" font-weight="600">Evidence</text><text x="290" y="319" font-size="18" fill="#586774">Annex II/III technical file</text><circle cx="58" cy="364" r="9" fill="#174591"/><text x="84" y="371" font-size="20" font-weight="600">Notified body</text><text x="290" y="371" font-size="18" fill="#586774">Annex IX → CE mark</text>
